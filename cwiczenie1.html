<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ćwiczenie 1: Dopasuj pytanie do odpowiedzi - Lekcja 1</title>
    <!-- Zewnętrzny arkusz stylów -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="exercise-wrapper">
    <div class="app-container">
        <a href="index.html" class="home-link">&larr; Strona główna</a>
        <div class="header">
            <span class="badge">Słownictwo</span> <span class="badge">A1</span>
            <h1>Ćwiczenie 1</h1>
            <p>Dopasuj pytania lub zwroty do odpowiedzi</p>
        </div>

        <div class="instructions">
            💡 Kliknij w pierwszej kolumnie, a potem w drugiej. Aby posłuchać, kliknij głośnik 🔊
        </div>

        <div class="matching-grid">
            <!-- Lewa kolumna: Pytania / Zwroty -->
            <div>
                <div class="column-title">
                    <span>🗩 Pytanie / Zwrot</span>
                </div>
                <div class="item-list" id="questions-list">
                    <!-- Wygenerowane dynamicznie -->
                </div>
            </div>

            <!-- Prawa kolumna: Odpowiedzi -->
            <div>
                <div class="column-title">
                    <span>🗨 Odpowiedź</span>
                </div>
                <div class="item-list" id="answers-list">
                    <!-- Wygenerowane dynamicznie -->
                </div>
            </div>
        </div>

        <div class="feedback-box" id="feedback"></div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="resetExercise()">↻ Resetuj</button>
            <button class="btn btn-secondary" onclick="showSolution()">Pokaż</button>
        </div>
</div>

<script>
    const data = [
        { id: 1, question: "1. Jak masz na imię?", answer: "C. Mam na imię Tom." },
        { id: 2, question: "2. Jak się pani nazywa?", answer: "A. Nazywam się Mira Kowalska." },
        { id: 3, question: "3. Bardzo mi miło.", answer: "B. Miło mi cię poznać." }
    ];

    let selectedQuestion = null;
    let selectedAnswer = null;
    let matchedPairs = 0;
    let nextPairNumber = 1;

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        let shuffled = [...array];
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [shuffled[currentIndex], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[currentIndex]];
        }
        return shuffled;
    }

    function shuffleDerangement(array) {
        if (array.length <= 1) return [...array];

        let shuffled;
        let hasAnswerInOriginalPosition;

        do {
            shuffled = shuffle(array);
            hasAnswerInOriginalPosition = shuffled.some((item, index) => item.id === array[index].id);
        } while (hasAnswerInOriginalPosition);

        return shuffled;
    }

    let shuffledAnswers = shuffleDerangement(data);

    function init() {
        const qList = document.getElementById('questions-list');
        const aList = document.getElementById('answers-list');
        
        qList.innerHTML = '';
        aList.innerHTML = '';
        selectedQuestion = null;
        selectedAnswer = null;
        matchedPairs = 0;
        nextPairNumber = 1;

        document.getElementById('feedback').className = 'feedback-box';

        data.forEach(item => {
            const qCard = document.createElement('div');
            qCard.className = 'card-item';
            qCard.dataset.id = item.id;
            qCard.onclick = () => selectQuestion(item.id);

            qCard.innerHTML = `
                <div class="item-text">
                    ${item.question}
                </div>
                <div class="card-controls">
                    <button class="audio-btn" onclick="speak('${item.question.replace(/^\d+\.\s*/, '')}', event)" title="Posłuchaj wymowy">
                        🔊
                    </button>
                </div>
            `;
            qList.appendChild(qCard);
        });

        shuffledAnswers.forEach(item => {
            const aCard = document.createElement('div');
            aCard.className = 'card-item';
            aCard.dataset.id = item.id;
            aCard.onclick = () => selectAnswer(item.id);

            aCard.innerHTML = `
                <div class="item-text">
                    ${item.answer}
                </div>
                <div class="card-controls">
                    <button class="audio-btn" onclick="speak('${item.answer.replace(/^[A-Z]\.\s*/, '')}', event)" title="Posłuchaj wymowy">
                        🔊
                    </button>
                </div>
            `;
            aList.appendChild(aCard);
        });
    }

    function selectQuestion(id) {
        const card = document.querySelector(`#questions-list .card-item[data-id="${id}"]`);
        if (card.classList.contains('matched')) return;
        if (selectedQuestion === id) {
            selectedQuestion = null;
            updateSelectionStyles();
            return;
        }
        selectedQuestion = id;
        if (selectedAnswer !== null) {
            makePair(selectedQuestion, selectedAnswer);
            selectedQuestion = null;
            selectedAnswer = null;
        }
        updateSelectionStyles();
    }

    function selectAnswer(id) {
        const card = document.querySelector(`#answers-list .card-item[data-id="${id}"]`);
        if (card.classList.contains('matched')) return;
        if (selectedAnswer === id) {
            selectedAnswer = null;
            updateSelectionStyles();
            return;
        }
        selectedAnswer = id;
        if (selectedQuestion !== null) {
            makePair(selectedQuestion, selectedAnswer);
            selectedQuestion = null;
            selectedAnswer = null;
        }
        updateSelectionStyles();
    }

    function getOrCreatePairBadge(card) {
        let badge = card.querySelector('.pair-badge');
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'pair-badge';
            card.querySelector('.card-controls').appendChild(badge);
        }
        return badge;
    }

    function makePair(qId, aId) {
        const questionCard = document.querySelector(`#questions-list .card-item[data-id="${qId}"]`);
        const answerCard = document.querySelector(`#answers-list .card-item[data-id="${aId}"]`);
        selectedQuestion = null;
        selectedAnswer = null;
        updateSelectionStyles();

        if (qId === aId) {
            questionCard.classList.add('correct', 'matched');
            answerCard.classList.add('correct', 'matched');

            [questionCard, answerCard].forEach(card => {
                const badge = getOrCreatePairBadge(card);
                badge.textContent = nextPairNumber;
                badge.classList.add('active');
            });
            nextPairNumber++;
            matchedPairs++;

            if (matchedPairs === data.length) {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback-box success';
                feedback.innerText = 'Świetnie! Wszystko masz dobrze.';
                feedback.classList.add('visible');
            }
        } else {
            questionCard.classList.add('incorrect');
            answerCard.classList.add('incorrect');

            setTimeout(() => {
                questionCard.classList.remove('incorrect');
                answerCard.classList.remove('incorrect');
            }, 800);
        }
    }

    function updateSelectionStyles() {
        document.querySelectorAll('#questions-list .card-item').forEach(card => {
            const id = parseInt(card.dataset.id);
            if (id === selectedQuestion) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        document.querySelectorAll('#answers-list .card-item').forEach(card => {
            const id = parseInt(card.dataset.id);
            if (id === selectedAnswer) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });
    }

    function resetExercise() {
        document.querySelectorAll('.card-item').forEach(card => {
            card.className = 'card-item';
        });
        shuffledAnswers = shuffleDerangement(data);
        init();
    }

    function showSolution() {
        resetExercise();
        data.forEach((item, index) => {
            const questionCard = document.querySelector(`#questions-list .card-item[data-id="${item.id}"]`);
            const answerCard = document.querySelector(`#answers-list .card-item[data-id="${item.id}"]`);
            questionCard.classList.add('correct', 'matched');
            answerCard.classList.add('correct', 'matched');

            [questionCard, answerCard].forEach(card => {
                const badge = getOrCreatePairBadge(card);
                badge.textContent = index + 1;
                badge.classList.add('active');
            });
        });
        matchedPairs = data.length;

        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback-box success';
        feedback.innerHTML = '✨ Oto poprawne rozwiązanie!';
        feedback.classList.add('visible');
    }

    function speak(text, event) {
        event.stopPropagation();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('Twoja przeglądarka nie wspiera syntezatora mowy.');
        }
    }

    window.onload = init;
</script>
</body>
</html>
